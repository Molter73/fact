services:
  db:
    image: mongo:8.2.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    volumes:
      - db-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-password}@db:27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - db
    profiles: ["debug"]

  compendium:
    image: quay.io/mmoltras/fact-compendium:${FACT_TAG:-latest}
    environment:
      FACT_LOGLEVEL: debug
      FACT_COMPENDIUM_DB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-password}@db:27017
    depends_on:
      - db

  fact:
    image: quay.io/mmoltras/fact:${FACT_TAG:-latest}
    environment:
      FACT_HOST_MOUNT: /host
      FACT_PATHS: /etc/sensitive-files
      FACT_LOGLEVEL: debug
    depends_on:
      - compendium
    pid: host
    command:
      - --expose-metrics
      - --process-enabled
      - 'http://compendium:8080'
    ports:
    - 9000:9000
    volumes:
      - source: /
        target: /host
        read_only: true
        type: bind
    privileged: true

volumes:
  db-data:
