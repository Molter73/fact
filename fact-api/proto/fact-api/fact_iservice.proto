syntax = "proto3";

package fact_api;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "fact-api/file.proto";
import "fact-api/process.proto";
import "fact-api/network.proto";

option cc_enable_arenas = true;

message FactMsg {
  google.protobuf.Timestamp timestamp = 1;
  // The hostname/name of the node where the file activity occurred
  string hostname = 2;
  oneof msg {
    FileActivity file = 3;
    ProcessActivity process = 4;
    NetworkActivity net = 5;
  }
}

service FactService {
  rpc Communicate(stream FactMsg) returns (google.protobuf.Empty);
}
