[package]
name = "fact"
version = "0.5.0-dev"
edition = "2024"

license.workspace = true

[dependencies]
anyhow = { workspace = true }
aya = { workspace = true }
clap = { version = "4.5.41", features = ["derive", "env"] }
env_logger = { workspace = true }
glob = "0.3.3"
globset = { workspace = true }
governor = "0.10.4"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", default-features = false }
hyper-tls = "0.6.0"
hyper-util = { version = "0.1.16", default-features = false }
libc = { workspace = true }
log = { workspace = true }
native-tls = { version = "0.2.14", features = ["alpn"] }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
openssl = "0.10.75"
tonic = { workspace = true }
tokio = { workspace = true }
tokio-native-tls = "0.3.1"
tokio-stream = { workspace = true }
prometheus-client = { version = "0.25.0", default-features = false }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { version = "0.10.1", default-features = false, features = ["thread_rng"] }
serde = { workspace = true }
serde_json = "1.0.142"
shlex = { workspace = true }
thiserror = { version = "2.0.18" }
uuid = { workspace = true }
yaml-rust2 = "0.13.0"

fact-api = { path = "../fact-api" }
fact-core = { path = "../fact-core"}
fact-ebpf = { path = "../fact-ebpf" }

[dev-dependencies]
tempfile = { version = "3.20.0", default-features = false }
regex = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }

[[bin]]
name = "fact"
path = "src/main.rs"

[features]
bpf-test = ["fact-core/bpf-test"]
otel = ["fact-core/otel"]
