- name: Create fact.container
  ansible.builtin.copy:
    content: |
      [Container]
      ContainerName=fact
      Environment=FACT_HOST_MOUNT=/host
      Environment=FACT_LOGLEVEL=debug
      Environment=FACT_PATHS=/etc:/etc/**/*:/bin:/bin/**/*:/usr/bin:/usr/bin/**/*:/sbin:/sbin/**/*:/usr/sbin:/usr/sbin/**/*:/var/lib/mysql:/var/lib/mysql/**/*
      Exec=--process-enabled http://10.10.0.1:8080
      Image=quay.io/mmoltras/fact:tfg
      Network=host
      Volume=/:/host:ro
      PodmanArgs=--privileged --pid=host

      [Service]
      Restart=Always

      [Install]
      WantedBy=default.target
    dest: "{{ systemd_dir }}/fact.container"
    mode: '0644'

- name: Start fact service
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: fact
    scope: system
    state: started
