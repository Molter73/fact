- name: Create configuration directory
  ansible.builtin.file:
    path: /etc/stackrox
    mode: '0755'
    state: directory

- name: Create configuration file
  ansible.builtin.copy:
    content: |
      paths:
        - '/etc'
        - '/etc/**/*'
        - '/bin'
        - '/bin/**/*'
        - '/usr/bin'
        - '/usr/bin/**/*'
        - '/sbin'
        - '/sbin/**/*'
        - '/usr/sbin'
        - '/usr/sbin/**/*'
        - '/usr/share/wordpress'
        - '/usr/share/wordpress/**/*'
      grpc:
        url: http://10.10.0.1:8080
      process:
        enabled: true
      network:
        enabled: true
    mode: '0644'
    dest: /etc/stackrox/fact.yml

- name: Create fact.container
  ansible.builtin.copy:
    content: |
      [Container]
      ContainerName=fact
      Environment=FACT_HOST_MOUNT=/host
      Environment=FACT_LOGLEVEL=info
      Image=quay.io/mmoltras/fact:tfg
      Network=host
      Volume=/:/host:ro
      Volume=/etc/stackrox/fact.yml:/etc/stackrox/fact.yml:ro
      PodmanArgs=--privileged --pid=host

      [Service]
      Restart=Always

      [Install]
      WantedBy=default.target
    dest: "{{ systemd_dir }}/fact.container"
    mode: '0644'

- name: Start fact service
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: fact
    scope: system
    state: started
