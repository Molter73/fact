- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Ensure WordPress directory exists
  ansible.builtin.file:
    path: "{{ wp_dir }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"

- name: Deploy nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx

- name: Deploy WordPress virtual host
  ansible.builtin.template:
    src: wordpress-vhost.conf.j2
    dest: /etc/nginx/conf.d/wordpress.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx

- name: Remove default nginx conf
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: restart nginx

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
