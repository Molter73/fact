- name: Install dependencies
  ansible.builtin.dnf:
    name:
      - curl
      - firewalld
      - git
      - make
      - podman
      - podman-compose
      - podman-docker
      - policycoreutils-python-utils
      - python3-mysqlclient
      - tar
      - wget
    state: latest

- name: Update the system
  ansible.builtin.dnf:
    name: ['*']
    state: latest

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Open HTTP port in firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Set selinux to permissive mode
  ansible.posix.selinux:
    policy: targeted
    state: permissive
